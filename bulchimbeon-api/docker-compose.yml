# 개발 표준은 `docker compose up -d db` — DB만 컨테이너로 띄우고 앱은 호스트에서 돌린다 (03 §5.1).
# 아래 `api` 서비스는 **배포 이미지 검증용**이며 개발 루프에서는 쓰지 않는다.
# 두 모드를 섞으면 DATABASE_URL 호스트명(localhost vs db)과 STORAGE_DIR가 어긋나
# "마이그레이션은 됐는데 앱이 빈 DB를 본다" / "업로드 파일이 사라진다"가 난다 (03 §5.2).

services:
  db:
    # 로컬·CI·배포 전부 pg18로 통일한다 — M-1에서 Railway가 18.4를 주는 것이 확인됐고
    # 배포가 진실이므로 거기에 맞춘다 (03 §1).
    image: pgvector/pgvector:pg18
    environment:
      POSTGRES_USER: bulchimbeon
      POSTGRES_PASSWORD: bulchimbeon
      POSTGRES_DB: bulchimbeon
    ports:
      - "5432:5432"
    volumes:
      # ⚠️ pg18+ 이미지는 데이터를 메이저 버전별 하위 디렉터리(/var/lib/postgresql/18/docker)에 둔다.
      # pg16 시절 관행대로 /var/lib/postgresql/data 에 마운트하면 기동이 즉시 실패한다
      # ("these Docker images are configured to store database data in a format
      #   which is compatible with pg_ctlcluster"). 마운트는 반드시 부모 디렉터리에.
      - pgdata:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U bulchimbeon -d bulchimbeon"]
      interval: 5s
      timeout: 3s
      retries: 12
      start_period: 10s

  api:
    build: .
    depends_on:
      db:
        condition: service_healthy
    environment:
      DATABASE_URL: postgresql+asyncpg://bulchimbeon:bulchimbeon@db:5432/bulchimbeon
      TEST_DATABASE_URL: postgresql+asyncpg://bulchimbeon:bulchimbeon@db:5432/bulchimbeon_test
      STORAGE_DIR: /app/storage
    ports:
      - "8000:8000"
    volumes:
      - storage:/app/storage
    # --workers 1 고정. SSE 구독자 큐가 인메모리이고 APScheduler가 프로세스마다
    # 중복 발화하므로 워커를 늘리면 조용히 깨진다 (CLAUDE.md 룰 9).
    command: ["uvicorn", "app.main:app", "--host", "0.0.0.0", "--port", "8000", "--workers", "1"]
    healthcheck:
      test: ["CMD-SHELL", "python -c \"import urllib.request,sys; sys.exit(0 if urllib.request.urlopen('http://localhost:8000/api/health').status == 200 else 1)\""]
      interval: 10s
      timeout: 5s
      retries: 6
      start_period: 20s

volumes:
  pgdata:
  storage:
