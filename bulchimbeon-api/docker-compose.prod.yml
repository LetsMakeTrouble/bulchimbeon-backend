# 운영 배포용 compose (2026-08-12).
#
# 개발용 `docker-compose.yml` 과 **섞어 쓰지 마라.** 그쪽은 DB 만 띄우고 앱은 호스트에서
# 돌리는 개발 표준이며(`03 §5.1`), 비밀값이 개발용으로 박혀 있고 마이그레이션도 돌지 않는다.
#
#   cp .env.prod.example .env.prod   # 값을 채운다
#   docker compose --env-file .env.prod -f docker-compose.prod.yml up -d --build
#
# ⛔ **비밀값에 기본값을 두지 않는다.** `${VAR:?...}` 문법이라 안 채우면 compose 가
#    기동 전에 죽는다. `SECRET_KEY=change-me` 인 채로 조용히 뜨는 것이 최악이다 —
#    로그인 토큰을 누구나 위조할 수 있게 된다.

name: bulchimbeon

services:
  # 마이그레이션을 **별도 원샷 서비스**로 돌린다. 앱 커맨드에 `alembic && uvicorn` 을
  # 붙이면 마이그레이션 실패가 앱 재시작 루프에 묻혀 원인이 안 보인다.
  # 여기서 죽으면 `api` 는 아예 시작하지 않는다 (`service_completed_successfully`).
  migrate:
    build: .
    depends_on:
      db:
        condition: service_healthy
    environment:
      DATABASE_URL: postgresql+asyncpg://${POSTGRES_USER:?}:${POSTGRES_PASSWORD:?}@db:5432/${POSTGRES_DB:?}
      # alembic 은 앱 설정을 로드하므로 필수 값이 비어 있으면 여기서 먼저 죽는다.
      SECRET_KEY: ${SECRET_KEY:?SECRET_KEY 를 설정하라 — 기본값이면 토큰을 위조할 수 있다}
      INTEGRATION_ENCRYPTION_KEY: ${INTEGRATION_ENCRYPTION_KEY:?32바이트 이상으로 설정하라}
      OPENAI_API_KEY: ${OPENAI_API_KEY:?}
      STORAGE_DIR: /app/storage
    command: ["alembic", "upgrade", "head"]
    restart: "no"

  db:
    # ⚠️ pg18 로 고정한다. pgvector 는 이 이미지가 0.8.6 을 준다 — `iterative_scan`(0.8.0+)이
    #    없으면 인덱스는 만들어지고 **검색만 조용히 0건**이 된다 (`03 §9.1`).
    image: pgvector/pgvector:pg18
    environment:
      POSTGRES_USER: ${POSTGRES_USER:?}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?}
      POSTGRES_DB: ${POSTGRES_DB:?}
    volumes:
      # ⚠️ pg18+ 이미지는 데이터를 메이저 버전별 하위 디렉터리에 둔다. pg16 관행대로
      #    `/var/lib/postgresql/data` 에 마운트하면 기동이 즉시 실패한다. 부모에 마운트한다.
      - pgdata:/var/lib/postgresql
    # ⛔ 포트를 호스트로 열지 않는다. 앱만 내부망으로 붙는다.
    #    외부에서 psql 로 붙어야 하면 SSH 터널을 쓰고, 그때만 임시로 연다.
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 5s
      timeout: 3s
      retries: 12
      start_period: 10s
    restart: unless-stopped

  api:
    build: .
    depends_on:
      db:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
    environment:
      APP_ENV: demo
      DATABASE_URL: postgresql+asyncpg://${POSTGRES_USER:?}:${POSTGRES_PASSWORD:?}@db:5432/${POSTGRES_DB:?}
      STORAGE_DIR: /app/storage

      SECRET_KEY: ${SECRET_KEY:?}
      INTEGRATION_ENCRYPTION_KEY: ${INTEGRATION_ENCRYPTION_KEY:?}
      OPENAI_API_KEY: ${OPENAI_API_KEY:?}
      # ⚠️ 스킴까지 정확히. 쉼표 구분이며 와일드카드(`*`)를 쓰지 마라 —
      #    `allow_credentials=True` 와 함께면 위험하다 (`09 §7.7`).
      CORS_ORIGINS: ${CORS_ORIGINS:?}
      # 저장소에 공개된 기본값(`demo1234!`)을 그대로 두지 마라 (`09 §7.6`).
      DEMO_PASSWORD: ${DEMO_PASSWORD:?}

      # 동시성 — 세 값은 **함께** 움직인다 (`03 §4.3`).
      # DB 의 max_connections 가 빠듯하면 셋을 같이 줄여라.
      PIPELINE_MAX_CONCURRENCY: ${PIPELINE_MAX_CONCURRENCY:-8}
      DB_POOL_SIZE: ${DB_POOL_SIZE:-10}
      DB_MAX_OVERFLOW: ${DB_MAX_OVERFLOW:-10}
    ports:
      - "${API_PORT:-8000}:8000"
    volumes:
      # 업로드 원본이 여기 쌓인다. **이 볼륨을 잃으면 문서 원문이 사라진다** —
      # DB 만 백업하면 청크·임베딩은 남지만 원본 파일은 복구되지 않는다.
      - storage:/app/storage
    # ⛔ `--workers 1` 고정 (룰 9). SSE 구독자 큐가 인메모리이고 APScheduler 가
    #    프로세스마다 중복 발화하므로 늘리면 조용히 깨진다.
    command: ["uvicorn", "app.main:app", "--host", "0.0.0.0", "--port", "8000", "--workers", "1"]
    healthcheck:
      test: ["CMD-SHELL", "python -c \"import urllib.request,sys; sys.exit(0 if urllib.request.urlopen('http://localhost:8000/health').status == 200 else 1)\""]
      interval: 10s
      timeout: 5s
      retries: 6
      start_period: 20s
    restart: unless-stopped

volumes:
  pgdata:
  storage:
